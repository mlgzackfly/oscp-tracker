server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # 安全標頭（縱深防禦）。XSS 已在前端逐字轉義防住，這裡再擋 clickjacking 與 MIME 嗅探。
    # 注意：nginx 的 add_header 若在 location 內重設會蓋掉這裡，所以全部統一放在 server 層。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx 預設 mime.types 沒有 .webmanifest；只補這一個型別，不動其他繼承的型別與標頭
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript;
    gzip_min_length 1024;
}
